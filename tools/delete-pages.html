<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حذف صفحات من PDF مجاناً | أدوات PDF</title>
  <meta name="description" content="احذف صفحات غير مرغوبة من ملف PDF بسهولة وخصوصية كاملة.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="../index.html" class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
        أدوات PDF
      </a>
      <button class="menu-toggle" aria-label="القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="../index.html">الرئيسية</a></li>
        <li><a href="delete-pages.html">حذف صفحات</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="tool-header">
      <h1>حذف صفحات من PDF</h1>
      <p>حدد الصفحات التي تريد حذفها واحصل على ملف نظيف فوراً.</p>
    </div>

    <div class="privacy-banner">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      <div>خصوصيتك محفوظة: العملية محلية بالكامل.</div>
    </div>

    <div class="drop-zone" id="dropZone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
      <h3>اسحب ملف PDF هنا</h3>
      <p>أو اضغط لاختيار الملف</p>
      <input type="file" id="fileInput" class="file-input" accept=".pdf,application/pdf">
    </div>

    <div id="fileInfo" class="file-list" style="display:none;"></div>

    <div class="options-panel" id="options" style="display:none;">
      <label>الصفحات المراد حذفها (مثال: 2,4-6,9)</label>
      <input type="text" id="pagesToDelete" placeholder="مثال: 1,3-5">
    </div>

    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="status" class="status"></div>

    <div class="actions">
      <button class="btn btn-primary" id="deleteBtn" disabled>حذف الصفحات</button>
      <button class="btn btn-secondary" id="clearBtn" style="display:none;">مسح</button>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom" style="border:none;padding-top:0;">
      © 2026 أدوات PDF — <a href="../index.html" style="color:#94a3b8;">الرئيسية</a>
    </div>
  </footer>

  <script src="../js/common.js"></script>
  <script>
    let selectedFile = null;
    let totalPages = 0;

    setupDropZone('dropZone', 'fileInput', async (files) => {
      selectedFile = files[0];
      document.getElementById('fileInfo').style.display = 'block';
      document.getElementById('fileInfo').innerHTML = `
        <div class="file-item">
          <div class="file-info">
            <div class="file-icon">PDF</div>
            <div>
              <div class="file-name">${selectedFile.name}</div>
              <div class="file-size">${formatFileSize(selectedFile.size)}</div>
            </div>
          </div>
        </div>`;
      document.getElementById('options').style.display = 'block';
      document.getElementById('deleteBtn').disabled = false;
      document.getElementById('clearBtn').style.display = 'inline-flex';
      try {
        const { PDFDocument } = await loadPdfLib();
        const pdf = await PDFDocument.load(await selectedFile.arrayBuffer(), { ignoreEncryption: true });
        totalPages = pdf.getPageCount();
        document.getElementById('pagesToDelete').placeholder = `مثال: 1,3-5 (إجمالي ${totalPages} صفحة)`;
      } catch(e) {}
    }, false);

    document.getElementById('clearBtn').addEventListener('click', () => {
      selectedFile = null;
      document.getElementById('fileInfo').style.display = 'none';
      document.getElementById('options').style.display = 'none';
      document.getElementById('deleteBtn').disabled = true;
      document.getElementById('clearBtn').style.display = 'none';
    });

    function parsePages(str, max) {
      const set = new Set();
      str.split(',').forEach(part => {
        if (part.includes('-')) {
          const [a,b] = part.split('-').map(n => parseInt(n.trim(),10));
          if (!isNaN(a) && !isNaN(b)) for (let i=Math.max(1,a); i<=Math.min(max,b); i++) set.add(i-1);
        } else {
          const n = parseInt(part.trim(),10);
          if (!isNaN(n) && n>=1 && n<=max) set.add(n-1);
        }
      });
      return set;
    }

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!selectedFile) return;
      const btn = document.getElementById('deleteBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> جاري الحذف...';
      setProgress(20);

      try {
        const { PDFDocument } = await loadPdfLib();
        const pdfDoc = await PDFDocument.load(await selectedFile.arrayBuffer(), { ignoreEncryption: true });
        const toDelete = parsePages(document.getElementById('pagesToDelete').value, pdfDoc.getPageCount());
        if (toDelete.size === 0) {
          showStatus('status', 'حدد صفحات للحذف.', 'error');
          return;
        }
        const indices = Array.from(toDelete).sort((a,b) => b-a);
        indices.forEach(i => pdfDoc.removePage(i));
        setProgress(80);
        const bytes = await pdfDoc.save();
        setProgress(100);
        downloadBlob(new Blob([bytes], {type:'application/pdf'}), 'pages-deleted.pdf');
        showStatus('status', `تم حذف ${toDelete.size} صفحة بنجاح.`, 'success');
      } catch (err) {
        console.error(err);
        showStatus('status', 'حدث خطأ.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'حذف الصفحات';
      }
    });
  </script>
</body>
</html>
