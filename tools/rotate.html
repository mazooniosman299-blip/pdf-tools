<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تدوير صفحات PDF مجاناً أونلاين | أدوات PDF</title>
  <meta name="description" content="أدر صفحات PDF 90 أو 180 أو 270 درجة بسهولة وخصوصية كاملة داخل المتصفح.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="../index.html" class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
        أدوات PDF
      </a>
      <button class="menu-toggle" aria-label="القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="../index.html">الرئيسية</a></li>
        <li><a href="merge.html">دمج</a></li>
        <li><a href="rotate.html">تدوير</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="tool-header">
      <h1>تدوير صفحات PDF</h1>
      <p>أدر كل الصفحات أو صفحات محددة بالزاوية التي تريدها.</p>
    </div>

    <div class="privacy-banner">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      <div>خصوصيتك محفوظة: التدوير يتم محلياً.</div>
    </div>

    <div class="drop-zone" id="dropZone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
      <h3>اسحب ملف PDF هنا</h3>
      <p>أو اضغط لاختيار الملف</p>
      <input type="file" id="fileInput" class="file-input" accept=".pdf,application/pdf">
    </div>

    <div id="fileInfo" class="file-list" style="display:none;"></div>

    <div class="options-panel" id="options" style="display:none;">
      <label>زاوية التدوير</label>
      <select id="angle">
        <option value="90">90 درجة (يمين)</option>
        <option value="180">180 درجة</option>
        <option value="270">270 درجة (يسار)</option>
      </select>
    </div>

    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="status" class="status"></div>

    <div class="actions">
      <button class="btn btn-primary" id="rotateBtn" disabled>تدوير PDF</button>
      <button class="btn btn-secondary" id="clearBtn" style="display:none;">مسح</button>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom" style="border:none;padding-top:0;">
      © 2026 أدوات PDF — <a href="../index.html" style="color:#94a3b8;">الرئيسية</a>
    </div>
  </footer>

  <script src="../js/common.js"></script>
  <script>
    let selectedFile = null;

    setupDropZone('dropZone', 'fileInput', (files) => {
      selectedFile = files[0];
      document.getElementById('fileInfo').style.display = 'block';
      document.getElementById('fileInfo').innerHTML = `
        <div class="file-item">
          <div class="file-info">
            <div class="file-icon">PDF</div>
            <div>
              <div class="file-name">${selectedFile.name}</div>
              <div class="file-size">${formatFileSize(selectedFile.size)}</div>
            </div>
          </div>
        </div>`;
      document.getElementById('options').style.display = 'block';
      document.getElementById('rotateBtn').disabled = false;
      document.getElementById('clearBtn').style.display = 'inline-flex';
      hideStatus('status');
    }, false);

    document.getElementById('clearBtn').addEventListener('click', () => {
      selectedFile = null;
      document.getElementById('fileInfo').style.display = 'none';
      document.getElementById('options').style.display = 'none';
      document.getElementById('rotateBtn').disabled = true;
      document.getElementById('clearBtn').style.display = 'none';
    });

    document.getElementById('rotateBtn').addEventListener('click', async () => {
      if (!selectedFile) return;
      const btn = document.getElementById('rotateBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> جاري التدوير...';
      setProgress(20);

      try {
        const { PDFDocument, degrees } = await loadPdfLib();
        const ab = await selectedFile.arrayBuffer();
        const pdfDoc = await PDFDocument.load(ab, { ignoreEncryption: true });
        const angle = parseInt(document.getElementById('angle').value, 10);
        const pages = pdfDoc.getPages();
        pages.forEach(page => {
          page.setRotation(degrees((page.getRotation().angle + angle) % 360));
        });
        setProgress(80);
        const bytes = await pdfDoc.save();
        setProgress(100);
        downloadBlob(new Blob([bytes], {type:'application/pdf'}), 'rotated.pdf');
        showStatus('status', 'تم تدوير الصفحات بنجاح!', 'success');
      } catch (err) {
        console.error(err);
        showStatus('status', 'حدث خطأ أثناء التدوير.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'تدوير PDF';
      }
    });
  </script>
</body>
</html>
